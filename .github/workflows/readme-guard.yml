name: readme-guard

on:
  push:
    branches: [main]
    paths: ['README.md', 'assets/**', 'scripts/check_readme.py', '.github/workflows/readme-guard.yml']
  pull_request:
  schedule:
    - cron: '41 5 * * 1'    # weekly, Monday 08:41 Europe/Istanbul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Placeholders, privacy denylist, markers, assets, SVGs, freshness
        run: python3 -B scripts/check_readme.py ${{ github.event_name == 'schedule' && '--freshness' || '' }}

      - name: Link check
        if: hashFiles('README.md') != ''
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept '200..=299,429'
            --exclude 'linkedin\.com' --exclude 'komarev\.com' --exclude 'medium\.com'
            --exclude 'gtu\.edu\.tr' --exclude 'spaceappschallenge\.org'
            README.md
          fail: true
