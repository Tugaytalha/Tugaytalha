<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='300' viewBox='0 0 1200 300' role='img' aria-labelledby='t d'>
  <title id='t'>Tugay Talha İçen, AI Engineer at AlbarakaTech. Self-hosted LLM systems: serving, retrieval, agents and voice.</title>
  <desc id='d'>An audio waveform turns into the tokens of the Turkish phrase 'merhaba dünya'. The tokens are illustrative.</desc>
  <defs>
    <linearGradient id='ink' gradientUnits='userSpaceOnUse' x1='64' y1='0' x2='470' y2='0'><stop offset='0' stop-color='#A78BFA'/><stop offset='1' stop-color='#22D3EE'/></linearGradient>
    <linearGradient id='wave' gradientUnits='userSpaceOnUse' x1='690' y1='0' x2='1140' y2='0'><stop offset='0' stop-color='#8B5CF6'/><stop offset='1' stop-color='#22D3EE'/></linearGradient>
    <pattern id='grid' width='24' height='24' patternUnits='userSpaceOnUse'><circle cx='1' cy='1' r='1' fill='#1E293B'/></pattern>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .bar{transform-box:fill-box;transform-origin:center;animation:talk 1.6s ease-in-out infinite}
    .tok{animation:emit 8s ease-out infinite both}
    @keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    @keyframes emit{0%,6%{opacity:0;transform:translateX(-10px)}14%,88%{opacity:1;transform:translateX(0)}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.bar,.tok{animation:none}}
  </style>
